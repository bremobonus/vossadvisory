name: Deploy dreaminc.io (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/manage-voss-advisory-6xIPn
    paths:
      - 'dreaminc/**'
      - '.github/workflows/deploy-dreaminc.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dreaminc
      - id: deployment
        uses: actions/deploy-pages@v4
